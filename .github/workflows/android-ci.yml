name: Android CI

# ── 트리거 ─────────────────────────────────────────────────────────
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:           # GitHub API 또는 웹 UI에서 수동 트리거 가능
    inputs:
      run_emulator_tests:
        description: '에뮬레이터 테스트 실행 여부 (true/false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# ── 빌드 Job ──────────────────────────────────────────────────────
jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 릴리스(앱 업데이트 파일) 게시용

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 고정 서명키 복원: 모든 빌드를 같은 키로 서명해야 앱 내 업데이트(덮어쓰기 설치)가 가능
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "signing key restored"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 secret 없음 - 임시 키로 서명됨 (업데이트 불가)"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          retention-days: 7

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # master push 시 GitHub Release 게시 → 앱의 [업데이트 확인] 버튼이 이 파일을 내려받음
      - name: Publish release for in-app update
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VC=$((GITHUB_RUN_NUMBER + 100))
          cp app/build/outputs/apk/debug/app-debug.apk "PhotoTransfer-${VC}.apk"
          printf '%s\n' "$COMMIT_MSG" > notes.txt
          gh release create "build-${VC}" "PhotoTransfer-${VC}.apk" \
            --title "build ${VC}" --notes-file notes.txt --latest

# ── 에뮬레이터 테스트 Job (수동 트리거 시에만) ─────────────────────
  emulator-test:
    name: Emulator Instrumented Test
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.run_emulator_tests == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant gradlew permission
        run: chmod +x gradlew

      # KVM 활성화 (에뮬레이터 하드웨어 가속)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 29 에뮬레이터 (Pixel 1 타겟과 동일)
      - name: Run Instrumented Tests on Emulator (API 29)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
       