name: Build cloudflared Android ARM64 (CGO)

on:
  workflow_dispatch:
    inputs:
      cloudflared_version:
        description: 'cloudflared 버전 태그 (예: 2025.4.0) 또는 "latest"'
        required: false
        default: 'latest'
  push:
    branches: [ master ]
    paths:
      - 'trigger-cloudflared-build'   # 이 파일 변경 시에만 빌드 트리거

permissions:
  contents: write

jobs:
  build-cloudflared:
    name: Build cloudflared (CGO, Android arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Android NDK r25c
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager             "ndk;25.2.9519653" > /dev/null
          echo "NDK_PATH=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Resolve cloudflared version
        id: resolve
        run: |
          INPUT="${{ github.event.inputs.cloudflared_version }}"
          if [ "$INPUT" = "latest" ] || [ -z "$INPUT" ]; then
            VERSION=$(curl -sf https://api.github.com/repos/cloudflare/cloudflared/releases/latest               | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          else
            VERSION="$INPUT"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "cloudflared 버전: $VERSION"

      - name: Clone cloudflared source
        run: |
          git clone --depth=1             --branch ${{ steps.resolve.outputs.version }}             https://github.com/cloudflare/cloudflared             /tmp/cloudflared

      - name: Build cloudflared (CGO_ENABLED=1, GOOS=android, arm64)
        run: |
          CC=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          cd /tmp/cloudflared
          CGO_ENABLED=1 \
          GOOS=android \
          GOARCH=arm64 \
          CC=$CC \
          CGO_CFLAGS="-O2 -fPIE" \
          CGO_LDFLAGS="-pie" \
          go build \
            -ldflags="-s -w" \
            -trimpath \
            -buildmode=pie \
            -o /tmp/libcloudflared_cgo.so \
            ./cmd/cloudflared
          ls -lh /tmp/libcloudflared_cgo.so
          file /tmp/libcloudflared_cgo.so
          readelf -h /tmp/libcloudflared_cgo.so | grep -E "Machine|Type|Class|OS/ABI"

      - name: Verify binary (ARM64 ELF)
        run: |
          file /tmp/libcloudflared_cgo.so | grep -q "ELF 64-bit" ||             (echo "ERROR: ARM64 ELF 아님"; exit 1)
          readelf -d /tmp/libcloudflared_cgo.so | grep NEEDED || true
          go version /tmp/libcloudflared_cgo.so || true

      - name: Replace binary in repo
        run: |
          DEST="app/src/main/jniLibs/arm64-v8a/libcloudflared.so"
          OLD_SIZE=$(ls -lh "$DEST" | awk '{print $5}')
          cp /tmp/libcloudflared_cgo.so "$DEST"
          NEW_SIZE=$(ls -lh "$DEST" | awk '{print $5}')
          echo "바이너리 교체: $OLD_SIZE -> $NEW_SIZE"

      - name: Commit and push
        run: |
          git config user.name "RyNusS"
          git config user.email "doa4004@gmail.com"
          VERSION="${{ steps.resolve.outputs.version }}"
          git add app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          if git diff --staged --quiet; then
            echo "바이너리 동일, 커밋 없음"
            exit 0
          fi
          git commit -m "chore: cloudflared Android arm64 CGO 빌드 교체 ($VERSION)

          - CGO_ENABLED=1: bionic getaddrinfo() -> Android DNS 정상 작동
          - GOOS=android GOARCH=arm64 API 21+
          - DNS 프록시 없이 바로 DNS 해결 가능"
          git push
